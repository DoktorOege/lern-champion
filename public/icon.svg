<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#ff4fa3"/>
      <stop offset=".45" stop-color="#8a3ffc"/>
      <stop offset="1" stop-color="#2a0b6b"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3a3"/>
      <stop offset=".45" stop-color="#ffd23f"/>
      <stop offset="1" stop-color="#ff9500"/>
    </linearGradient>
    <linearGradient id="b1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00e0ff"/><stop offset="1" stop-color="#2f80ff"/></linearGradient>
    <linearGradient id="b2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb347"/><stop offset="1" stop-color="#ff6a00"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#1a0040" flood-opacity=".55"/></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>
  <g id="all">
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- Strahlen -->
  <g transform="translate(256 250)" opacity=".18" fill="#fff">
    <path id="ray" d="M-18 0 L18 0 L6 -300 L-6 -300Z"/>
    <use href="#ray" transform="rotate(30)"/><use href="#ray" transform="rotate(60)"/><use href="#ray" transform="rotate(90)"/>
    <use href="#ray" transform="rotate(120)"/><use href="#ray" transform="rotate(150)"/><use href="#ray" transform="rotate(180)"/>
    <use href="#ray" transform="rotate(210)"/><use href="#ray" transform="rotate(240)"/><use href="#ray" transform="rotate(270)"/>
    <use href="#ray" transform="rotate(300)"/><use href="#ray" transform="rotate(330)"/>
  </g>
  <circle cx="256" cy="255" r="150" fill="#ffd23f" opacity=".45" filter="url(#glow)"/>
  <!-- Stern -->
  <g filter="url(#sh)">
    <path d="M256 82 L304 190 L421 201 L332 279 L359 394 L256 334 L153 394 L180 279 L91 201 L208 190 Z"
          fill="url(#gold)" stroke="#c25e00" stroke-width="12" stroke-linejoin="round"/>
    <path d="M256 112 L295 199 L300 205 L248 196 Z" fill="#fff" opacity=".55"/>
  </g>
  <text x="256" y="300" text-anchor="middle" font-family="DejaVu Sans, Arial" font-weight="900" font-size="104" fill="#8a1f5a" opacity=".35">1×1</text>
  <text x="256" y="292" text-anchor="middle" font-family="DejaVu Sans, Arial" font-weight="900" font-size="104" fill="#fff" stroke="#8a1f5a" stroke-width="5" paint-order="stroke">1×1</text>
  <!-- Sprechblasen -->
  <g filter="url(#sh)">
    <path d="M330 52 h118 a26 26 0 0 1 26 26 v40 a26 26 0 0 1 -26 26 h-70 l-26 24 v-24 h-22 a26 26 0 0 1 -26 -26 v-40 a26 26 0 0 1 26 -26z" fill="url(#b1)" stroke="#fff" stroke-width="7"/>
    <text x="389" y="115" text-anchor="middle" font-family="DejaVu Sans, Arial" font-weight="900" font-size="50" fill="#fff">EN</text>
  </g>
  <g filter="url(#sh)">
    <path d="M64 368 h118 a26 26 0 0 1 26 26 v40 a26 26 0 0 1 -26 26 h-22 v24 l-26 -24 h-70 a26 26 0 0 1 -26 -26 v-40 a26 26 0 0 1 26 -26z" fill="url(#b2)" stroke="#fff" stroke-width="7"/>
    <text x="123" y="431" text-anchor="middle" font-family="DejaVu Sans, Arial" font-weight="900" font-size="50" fill="#fff">NL</text>
  </g>
  <!-- Funkeln -->
  <g fill="#fff">
    <path d="M440 300 l7 18 18 7 -18 7 -7 18 -7 -18 -18 -7 18 -7z"/>
    <path d="M80 120 l5 13 13 5 -13 5 -5 13 -5 -13 -13 -5 13 -5z" opacity=".9"/>
    <path d="M400 430 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4z" opacity=".8"/>
  </g>
  </g>
</svg>
